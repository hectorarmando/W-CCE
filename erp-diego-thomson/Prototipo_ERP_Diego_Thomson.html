<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ERP Diego Thomson</title>
<meta name="theme-color" content="#123E7C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diego Thomson">
<link rel="manifest" href="/erp-diego-thomson/manifest.webmanifest">
<link rel="apple-touch-icon" href="/erp-diego-thomson/icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: plataforma escolar — barra lateral azul marino + área de trabajo clara; paleta tomada del escudo (marino, celeste, rojo IEP, verde laurel) */
:root{
  --bg:#F3F7FB; --surface:#FFFFFF; --surface-2:#EAF1F8; --fg:#13284A; --muted:#5D6F88; --line:#DBE4EE;
  --primary:#123E7C; --primary-h:#0C3166; --on-primary:#FFFFFF; --violet:#1A7FC1; --violet-soft:#E2F1FA; --eyebrow:#C21F31; --red:#C8202F;
  --ok:#14805A; --ok-soft:#E2F4EC; --warn:#A6600B; --warn-soft:#FCF0DC; --bad:#C3243A; --bad-soft:#FCE6E9; --on-sem:#FFFFFF;
  --side-fg:#E3ECF8; --side-muted:#A7BEDD; --side-hi:rgba(255,255,255,.12); --side-strong:#FFFFFF;
  --grad:linear-gradient(125deg,#0A2A5E 0%,#134F9E 55%,#1F9FD3 100%);
  --side-grad:linear-gradient(180deg,#0C2B5E 0%,#124689 55%,#176BAE 100%);
  --th-bg:#123E7C; --th-fg:#FFFFFF; --bar-a:#2AA6DC; --bar-b:#123E7C; --grid:#E6EDF5;
  --shadow:0 1px 2px rgba(27,37,80,.05),0 8px 24px rgba(27,37,80,.07);
  --f-head:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1424; --surface:#0F1D33; --surface-2:#162947; --fg:#E6EEF8; --muted:#98AAC4; --line:#223859;
  --primary:#6FB4F0; --primary-h:#8CC4F4; --on-primary:#06142A; --violet:#5CC8EE; --violet-soft:#12304D; --eyebrow:#FF7C86; --red:#F0616C;
  --ok:#4CC890; --ok-soft:#123327; --warn:#E8B04E; --warn-soft:#3A2B10; --bad:#F2687C; --bad-soft:#3D1A24; --on-sem:#06121F;
  --th-bg:#173E70; --th-fg:#EAF3FF; --bar-a:#5CC8EE; --bar-b:#3F7FD0; --grid:#1D3150;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1424; --surface:#0F1D33; --surface-2:#162947; --fg:#E6EEF8; --muted:#98AAC4; --line:#223859;
  --primary:#6FB4F0; --primary-h:#8CC4F4; --on-primary:#06142A; --violet:#5CC8EE; --violet-soft:#12304D; --eyebrow:#FF7C86; --red:#F0616C;
  --ok:#4CC890; --ok-soft:#123327; --warn:#E8B04E; --warn-soft:#3A2B10; --bad:#F2687C; --bad-soft:#3D1A24; --on-sem:#06121F;
  --th-bg:#173E70; --th-fg:#EAF3FF; --bar-a:#5CC8EE; --bar-b:#3F7FD0; --grid:#1D3150;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.tn,td,.stat b{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--eyebrow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- login ---------- */
.login{min-height:100%;background:var(--grad);display:flex;flex-direction:column;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden}
.login::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:26px 26px;pointer-events:none}
.login-top{display:flex;align-items:center;gap:14px;color:#fff;position:relative;z-index:1;font-size:13px}
.login-top b{font-family:var(--f-head);font-size:17px;letter-spacing:.02em}
.login-top span{border-left:1px solid rgba(255,255,255,.4);padding-left:14px;opacity:.9}
.login-mid{flex:1;display:grid;place-items:center;padding-block:28px;position:relative;z-index:1}
.lcard{width:min(460px,100%);background:var(--surface);color:var(--fg);border-radius:18px;padding:34px 32px 26px;box-shadow:0 24px 60px rgba(4,16,40,.35);display:grid;gap:16px}
.lcard .crest{width:92px;height:92px;border-radius:22px;margin:0 auto;display:block;object-fit:cover;box-shadow:0 8px 20px rgba(18,62,124,.25)}
.lhead{text-align:center;display:grid;gap:4px;justify-items:center}
.lhead h1{font-size:22px}
.tag{display:inline-block;background:var(--violet-soft);color:var(--violet);font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 10px;margin-top:6px}
.lfoot{text-align:center;color:rgba(255,255,255,.75);font-size:12px;position:relative;z-index:1}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.rolebtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer;display:grid;gap:1px}
.rolebtn b{font-size:13px}.rolebtn span{font-size:11.5px;color:var(--muted)}
.rolebtn[aria-pressed="true"]{border-color:var(--primary);background:var(--violet-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.lbl{font-size:12.5px;font-weight:600;margin-bottom:6px;display:block}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{background:var(--side-grad);color:var(--side-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 12px;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 18px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.brand b{display:block;font-family:var(--f-head);font-size:14.5px;color:var(--side-strong);line-height:1.2}
.brand span{font-size:11.5px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;border:0;background:none;color:var(--side-fg);text-align:left;cursor:pointer;font-weight:500;font-size:13.5px}
.nav button:hover{background:var(--side-hi)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.16);color:var(--side-strong);font-weight:600;box-shadow:inset 3px 0 0 #E8414F}
.side-foot{margin-top:auto;display:grid;gap:10px;font-size:11.5px;color:var(--side-muted);padding:16px 8px 0;border-top:1px solid rgba(255,255,255,.14)}
.side-foot b{font-family:var(--f-head);font-size:17px;color:var(--side-strong);letter-spacing:.02em}
.side-foot button{background:var(--side-hi);border:0;color:var(--side-fg);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:12px;text-align:left}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:500}
.top-l p{font-size:12px;color:var(--muted)}
.gs{position:relative}
.gs .in{padding-left:34px;width:240px;background:var(--surface-2);border-color:transparent}
.gs svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gs-res{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:280px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(27,37,80,.16);padding:6px;z-index:20;display:grid;gap:2px}
.gs-res button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;display:grid}
.gs-res button:hover{background:var(--surface-2)}
.gs-res span{font-size:12px;color:var(--muted)}
.bell{position:relative;border:0;background:none;cursor:pointer;color:var(--fg);width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.bell:hover{background:var(--surface-2)}
.bell i{position:absolute;top:3px;right:3px;background:var(--bad);color:var(--on-sem);font-style:normal;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.hello{display:grid;gap:3px}
.hello small{font-size:12.5px;color:var(--muted)}
.hello h2{font-size:26px;font-weight:500}
.hello p{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.kic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--violet-soft);color:var(--violet)}
.kic.ok{background:var(--ok-soft);color:var(--ok)}.kic.bad{background:var(--bad-soft);color:var(--bad)}.kic.p{background:var(--surface-2);color:var(--primary)}
.kpi .lab{font-size:12px;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-head);font-size:22px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi small{font-size:11.5px;color:var(--muted)}
.pi{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--surface-2);cursor:pointer;border:0;width:100%;text-align:left;color:var(--fg)}
.pi:hover{box-shadow:inset 0 0 0 1px var(--line)}
.pi .num{width:32px;height:32px;border-radius:9px;background:var(--violet-soft);color:var(--violet);font-family:var(--f-head);font-weight:600;font-size:15px;display:grid;place-items:center;flex:none}
.pi .tx{flex:1;min-width:0;display:grid}
.pi .tx b{font-size:13px;font-weight:600}.pi .tx span{font-size:12px;color:var(--muted)}
.pi svg{color:var(--muted);flex:none}
.sch{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sch:last-child{border-bottom:0}
.sch .h{font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.sch .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:4px;align-content:start}
.ccard .kic{margin-bottom:10px}
.ccard h3{font-size:16px;font-weight:500}
.ccard small{font-size:11.5px;color:var(--muted)}
.t.vh th{background:var(--th-bg);color:var(--th-fg)}
.t.vh{min-width:680px}
/* selector de perfil */
.chooser{min-height:100%;background:var(--bg);display:flex;flex-direction:column}
.ch-top{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.ch-top .brand{border:0;padding:0}
.ch-top .brand b{color:var(--fg)}.ch-top .brand span{color:var(--muted)}
.ch-top .brand img{box-shadow:none}
.ch-mid{flex:1;padding-block:48px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;justify-items:center;gap:28px;align-content:start}
.ch-mid header{text-align:center;display:grid;gap:8px}
.ch-mid header h1{font-size:clamp(26px,4vw,36px);font-weight:500}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;width:min(1180px,100%)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:4px;align-content:start;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--primary)}
.pcard .kic{margin-bottom:14px}
.pcard h2{font-size:18px;font-weight:500;margin-bottom:10px}
.pcard .who2 b{display:block;font-size:13.5px}.pcard .who2 span{font-size:12px;color:var(--muted)}
.pcard ul{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;gap:7px;font-size:12.5px}
.pcard li{display:flex;gap:8px;align-items:flex-start}
.pcard li::before{content:"✓";color:var(--ok);font-weight:700}
.pcard .go{margin-top:10px;color:var(--primary);font-weight:600;font-size:13.5px}
.top-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who{display:flex;gap:9px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.who b{display:block;font-size:13px;line-height:1.2}.who span{font-size:11.5px;color:var(--muted)}
.content{padding-block:24px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:20px;width:100%;max-width:1260px}
.demo-note{font-size:11.5px;color:var(--muted)}

/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h h2{font-size:16px}
.card-h p{font-size:12.5px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stat{padding:18px 16px;text-align:center;display:grid;gap:2px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{font-family:var(--f-head);font-size:25px;color:var(--primary);font-weight:600;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.stat small{font-size:11.5px;font-weight:600}
.g2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.t th:first-child{border-top-left-radius:8px}.t th:last-child{border-top-right-radius:8px}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right}.t .c{text-align:center}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--surface-2)}
.t td .sub{display:block;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--violet-soft);color:var(--violet)}
.chip.AD{background:var(--ok-soft);color:var(--ok)}.chip.A{background:var(--violet-soft);color:var(--violet)}.chip.B{background:var(--warn-soft);color:var(--warn)}.chip.C{background:var(--bad-soft);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13.5px;cursor:pointer;background:var(--primary);color:var(--on-primary);white-space:nowrap}
.btn:hover{background:var(--primary-h)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}.btn.out{display:inline-flex;align-items:center;gap:6px;color:var(--bad)}.btn.out:hover{background:var(--bad-soft);border-color:var(--bad)}@media(max-width:700px){.btn.out span{display:none}}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%;padding:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--primary);font-weight:600;cursor:pointer;padding:0;font-size:13px}
.in{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;min-height:38px;width:100%}
.in:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--violet-soft)}
textarea.in{min-height:84px;resize:vertical}
.field{display:grid;gap:5px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--fg)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.toolbar .field{min-width:170px;flex:1 1 170px;max-width:280px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-size:13.5px}
.tabs button[aria-selected="true"]{color:var(--primary);border-color:var(--primary)}
.tabs .n{font-size:11px;background:var(--surface-2);border-radius:999px;padding:1px 7px;margin-left:5px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.item .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet);flex:none;font-weight:700;font-size:13px}
.item .body{min-width:0;flex:1;display:grid;gap:3px}
.item .body b{font-weight:600}
.item .meta{font-size:12px;color:var(--muted)}
.item .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prog{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);border-radius:99px}
.dist{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);min-width:120px}
.dist i{display:block;height:100%}.dist .AD{background:var(--ok)}.dist .A{background:var(--violet)}.dist .B{background:var(--warn)}.dist .C{background:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:url(#gbar)}
.chart .gl{stroke:var(--grid)}
.chart .v{fill:var(--fg);font-size:12px;font-weight:600;font-family:var(--f-body)}
.chart .l{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.chart .base{stroke:var(--line)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:var(--warn-soft);color:var(--fg);font-size:13px}
.alert.info{background:var(--violet-soft)}

.mk{display:inline-flex;gap:4px}
.mk button{min-width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;color:var(--muted);font-size:12.5px}
.mk button.on.P{background:var(--ok);border-color:var(--ok);color:var(--on-sem)}
.mk button.on.T{background:var(--warn);border-color:var(--warn);color:var(--on-sem)}
.mk button.on.F{background:var(--bad);border-color:var(--bad);color:var(--on-sem)}
.gi{width:62px;text-align:center;padding:6px;min-height:34px}
.gi.badin{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.course{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.course .cov{height:74px;background:var(--grad);position:relative;display:flex;align-items:flex-end;padding:12px 14px;color:#fff;font-family:var(--f-head);font-weight:600;font-size:16px}
.course .cov[data-k="1"]{background:linear-gradient(125deg,#14608F,#1E3FA6)}
.course .cov[data-k="2"]{background:linear-gradient(125deg,#0E7A6A,#145E8E)}
.course .cov[data-k="3"]{background:linear-gradient(125deg,#8E1B2A,#C8202F)}
.course .cov[data-k="4"]{background:linear-gradient(125deg,#2E6B34,#3F8F3F)}
.course .cb{padding:12px 14px;display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.banner{background:var(--grad);color:#fff;border-radius:var(--r);padding:20px 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.banner h2{font-size:21px}.banner p{opacity:.85;font-size:13px}
.banner .eyebrow{color:#A9E4F7}
.q{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;background:var(--surface)}
.q h3{font-size:14.5px;font-weight:600;font-family:var(--f-body)}
.opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.opt:has(input:checked){border-color:var(--primary);background:var(--violet-soft)}
.timer{font-family:var(--f-head);font-size:22px;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.matrix td.c{font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(6,18,40,.55);display:grid;place-items:center;z-index:50;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.mb{background:var(--surface);color:var(--fg);border-radius:16px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:grid;gap:16px}
.mb.sm{width:min(560px,100%)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mh h2{font-size:18px}
.x{border:0;background:var(--surface-2);border-radius:9px;width:34px;height:34px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.mf{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:11px;font-weight:600;font-size:13.5px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* libreta */
.lib-h{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--primary);padding-bottom:12px}
.lib-h img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.lib-h h3{font-size:16px}

/* portal familia (celular) */
.pwrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
.phone{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(27,37,80,.18)}

.ph-h small{opacity:.8;font-size:12px}
.kids{display:flex;gap:6px;flex-wrap:wrap}
.kids button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.kids button[aria-pressed="true"]{background:#fff;color:#123E7C}
.ph-tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
.ph-tabs button{border:0;background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.ph-tabs button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.ph-b{padding:14px;display:grid;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface-2);border-radius:12px;padding:10px;display:grid;gap:1px}

.dots{display:flex;gap:5px;flex-wrap:wrap}

.dots .P{background:var(--ok-soft);color:var(--ok)}.dots .T{background:var(--warn-soft);color:var(--warn)}.dots .F{background:var(--bad-soft);color:var(--bad)}.dots .N{background:var(--surface-2);color:var(--muted)}
.pitem{border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:grid;gap:4px}
.pitem .row{display:flex;justify-content:space-between;gap:8px;align-items:center}

@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.g2,.g2e,.pwrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}

  .nav{flex-direction:row;overflow-x:auto;padding-bottom:2px}
  .nav button{white-space:nowrap}
  .side-foot{display:none}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:560px){
  .fg,.g3{grid-template-columns:minmax(0,1fr)}

  .toolbar .field{max-width:none}
  .phone{border-radius:18px}
  .gs{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{flex-direction:column;gap:8px;padding:14px}
  .kpi b{font-size:19px}
  .who div{display:none}
  .sch{grid-template-columns:52px minmax(0,1fr)}
  .sch .act{grid-column:1/-1;justify-content:flex-start}
}

/* ---------- efectos de la página web ---------- */
html{scroll-behavior:smooth}
.wh{transition:box-shadow .35s ease,background .35s ease}
.wh.scrolled{box-shadow:0 10px 30px rgba(18,40,74,.12)}
.wnav button{position:relative;transition:color .25s,background .25s}
.wnav button::after{content:"";position:absolute;left:11px;right:11px;bottom:3px;height:2px;border-radius:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.wnav button:hover::after,.wnav button.on::after{transform:scaleX(1)}
.wnav button.on{color:var(--primary)}
.btn{transition:background .2s,border-color .2s,color .2s,transform .2s,box-shadow .2s}
.web .btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(18,62,124,.18)}
.hero{background:linear-gradient(120deg,#0A2A5E,#134F9E,#1F9FD3,#134F9E,#0A2A5E);background-size:320% 320%;animation:gshift 22s ease infinite}
@keyframes gshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hero .wrap{padding-block:64px 150px}
.hero .in-l>*{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.hero .in-l>*:nth-child(2){animation-delay:.12s}.hero .in-l>*:nth-child(3){animation-delay:.24s}.hero .in-l>*:nth-child(4){animation-delay:.36s}.hero .in-l>*:nth-child(5){animation-delay:.48s}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#fff,#A9E4F7,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.hero-trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;font-size:13px;opacity:.92}
.hero-trust span{display:flex;gap:7px;align-items:center}
.hero-trust i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-style:normal;font-size:12px}
.particles{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particles span{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);animation:drift linear infinite}
.particles span.sq{border-radius:6px;background:transparent;border:2px solid rgba(255,255,255,.18)}
.particles span.rd{background:rgba(232,65,79,.5)}
@keyframes drift{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-30px) rotate(90deg)}100%{transform:translateY(0) rotate(180deg)}}
.orbit-wrap{position:relative;width:min(400px,100%);aspect-ratio:1;justify-self:center;animation:fadeUp 1s .2s cubic-bezier(.2,.7,.2,1) both}
.orbit-wrap .glow{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(169,228,247,.45),rgba(169,228,247,0) 70%);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.06);opacity:1}}
.orbit-wrap .ring{position:absolute;border-radius:50%;border:1.5px dashed rgba(255,255,255,.28)}
.orbit-wrap .r1{inset:4%;animation:spin 60s linear infinite}.orbit-wrap .r2{inset:20%;border-style:solid;border-color:rgba(255,255,255,.14);animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit-wrap .hero-logo{position:absolute;inset:23%;width:54%;height:54%;object-fit:contain;filter:drop-shadow(0 24px 40px rgba(2,14,36,.5));animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ob{--r:190px;position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;animation:orbit 30s linear infinite}
.ob span{display:grid;place-items:center;width:100%;height:100%;border-radius:15px;background:rgba(255,255,255,.95);color:#123E7C;box-shadow:0 10px 24px rgba(2,14,36,.3)}
.ob span.rdi{color:#C8202F}.ob span.gri{color:#2E7D32}
@keyframes orbit{from{transform:rotate(0deg) translateX(var(--r)) rotate(0deg)}to{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg)}}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:80px;z-index:1;display:block}
.wave path{fill:var(--surface)}
.hstats{margin-top:-96px}
.stat b .cnt{font-variant-numeric:tabular-nums;font-size:inherit;color:inherit}
.rv{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.pre{transform:translateY(34px)}
.val,.lv,.sd,.feat{transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease}
.val:hover,.lv:hover,.sd:hover{transform:translateY(-6px);box-shadow:0 18px 36px rgba(18,40,74,.14);border-color:transparent}
.val .lt{transition:background .3s,color .3s,transform .3s}
.val:hover .lt{background:var(--primary);color:var(--on-primary);transform:rotate(-8deg) scale(1.08)}
.lv .cov{height:170px;align-items:stretch;padding:0}
.lv .cov svg.ill{position:absolute;inset:0;width:100%;height:100%}
.lv .cov .tagl{position:absolute;left:16px;bottom:12px;font-family:var(--f-head);font-size:13px;font-weight:600;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px)}
.lv .bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.lv .bob.d2{animation-delay:-1.3s}.lv .bob.d3{animation-delay:-2.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lv .cov svg.ill{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.lv:hover .cov svg.ill{transform:scale(1.07)}
.lv .bd ul{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:5px;font-size:13px}
.lv .bd li{display:flex;gap:7px}.lv .bd li::before{content:"✓";color:var(--ok);font-weight:700}
/* vitrina de la plataforma */
.shw{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:48px;align-items:center}
.stabs{display:grid;gap:10px;margin-top:22px}
.stabs button{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .3s,box-shadow .3s,transform .3s;position:relative;overflow:hidden}
.stabs button b{display:block;font-size:15px;font-family:var(--f-head);font-weight:500}
.stabs button span.d{font-size:13px;color:var(--muted);line-height:1.5}
.stabs button .kic{flex:none}
.stabs button.on{border-color:var(--primary);box-shadow:0 12px 28px rgba(18,62,124,.14);transform:translateX(6px)}
.stabs button .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--red);width:0}
.stabs button.on .bar{animation:tprog 6s linear forwards}
.stabs.manual button.on .bar{animation:none;width:100%}
@keyframes tprog{to{width:100%}}
.device{position:relative;aspect-ratio:5/4;width:100%}
.device .bg{position:absolute;inset:6% 4%;border-radius:28px;background:var(--grad);opacity:.95}
.device .bg::after{content:"";position:absolute;inset:0;border-radius:28px;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:22px 22px}
.pane{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateY(16px) scale(.97);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.pane.on{opacity:1;transform:none;pointer-events:auto}
.mphone{width:min(240px,46%);aspect-ratio:9/18.5;background:var(--surface);border:9px solid #0B1B33;border-radius:34px;overflow:hidden;box-shadow:0 30px 60px rgba(2,14,36,.4);display:flex;flex-direction:column}
.mphone .mh{background:var(--grad);color:#fff;padding:14px 12px 12px;display:flex;gap:8px;align-items:center;font-size:11px;line-height:1.3}
.mphone .mh img{width:26px;height:25px;object-fit:contain}
.mphone .mb2{padding:10px;display:grid;gap:7px;align-content:start}
.nt{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:10px;padding:8px;font-size:10.5px;line-height:1.3;color:var(--fg)}
.nt i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;flex:none;font-size:11px}
.nt small{display:block;color:var(--muted);font-size:9.5px}
.pane.on .nt{animation:slideIn .6s cubic-bezier(.2,.7,.2,1) both}
.pane.on .nt:nth-child(2){animation-delay:.35s}.pane.on .nt:nth-child(3){animation-delay:.7s}.pane.on .nt:nth-child(4){animation-delay:1.05s}.pane.on .nt:nth-child(5){animation-delay:1.4s}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.mlap{width:86%;}
.mlap .scr{background:var(--surface);border:8px solid #0B1B33;border-bottom-width:12px;border-radius:14px 14px 4px 4px;aspect-ratio:16/10;overflow:hidden;box-shadow:0 30px 60px rgba(2,14,36,.35);display:grid;grid-template-columns:22% 1fr}
.mlap .base{height:12px;background:#1A2B47;border-radius:0 0 14px 14px;margin:0 -5%;box-shadow:0 10px 20px rgba(2,14,36,.25)}
.mlap .sb{background:var(--side-grad);padding:8px 6px;display:grid;gap:5px;align-content:start}
.mlap .sb i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.3)}.mlap .sb i.a{background:#fff}
.mlap .ct{padding:9px;display:grid;gap:6px;align-content:start;font-size:9px;color:var(--fg)}
.mlap .ct b{font-family:var(--f-head);font-size:10.5px}
.gr{display:grid;grid-template-columns:1.6fr repeat(3,1fr) 1fr;gap:3px;align-items:center}
.gr span{background:var(--surface-2);border-radius:4px;padding:3px 4px;text-align:center}
.gr span.n{text-align:left}
.gr span.p{background:var(--violet-soft);color:var(--primary);font-weight:700}
.pane.on .gr{animation:fadeUp .5s both}.pane.on .gr:nth-of-type(3){animation-delay:.15s}.pane.on .gr:nth-of-type(4){animation-delay:.3s}.pane.on .gr:nth-of-type(5){animation-delay:.45s}.pane.on .gr:nth-of-type(6){animation-delay:.6s}
.kp3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.kp3 div{background:var(--surface-2);border-radius:6px;padding:5px}
.kp3 b{display:block;font-size:12px;color:var(--primary)}
.bars{display:flex;align-items:flex-end;gap:8%;height:70px;padding:4px 6px 0;border-bottom:1px solid var(--line)}
.bars i{flex:1;border-radius:4px 4px 0 0;background:linear-gradient(var(--bar-a),var(--bar-b));transform-origin:bottom}
.pane.on .bars i{animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
.pane.on .bars i:nth-child(2){animation-delay:.12s}.pane.on .bars i:nth-child(3){animation-delay:.24s}.pane.on .bars i:nth-child(4){animation-delay:.36s}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.float-card{position:absolute;background:var(--surface);border-radius:12px;padding:9px 12px;box-shadow:0 16px 30px rgba(2,14,36,.25);font-size:12px;display:flex;gap:8px;align-items:center;animation:float 5s ease-in-out infinite;color:var(--fg)}
.float-card i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal}
/* sedes con mapa */
.sedes-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:stretch}
.smap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);min-height:300px}
.smap svg{width:100%;height:100%;display:block}
.smap .land{fill:var(--violet-soft)}.smap .road{stroke:var(--surface);stroke-width:9;fill:none;stroke-linecap:round}.smap .road2{stroke:var(--surface);stroke-width:4;fill:none}
.smap .park{fill:rgba(63,143,63,.18)}.smap .river{stroke:rgba(31,159,211,.45);stroke-width:12;fill:none;stroke-linecap:round}
.smap .pin .pm{transition:transform .3s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:50% 100%}
.smap .pin .ps{fill:var(--red);opacity:.35;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.smap .pin text{font-family:var(--f-head);font-size:11px;font-weight:600;fill:var(--fg)}
@keyframes ping{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2.4);opacity:0}}
.sedes-wrap .sedes{grid-template-columns:minmax(0,1fr)}
.sedes-wrap:has(.sd[data-s="cen"]:hover) .pin-cen .pm,.sedes-wrap:has(.sd[data-s="nor"]:hover) .pin-nor .pm,.sedes-wrap:has(.sd[data-s="sur"]:hover) .pin-sur .pm,.sedes-wrap:has(.sd[data-s="este"]:hover) .pin-este .pm{transform:scale(1.35)}
.sd .pin span{transition:transform .3s}.sd:hover .pin span{transform:rotate(-45deg) scale(1.12)}
/* proceso de admisión */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;position:relative}
.steps::before{content:"";position:absolute;left:12%;right:12%;top:27px;height:3px;background:var(--line);border-radius:3px}
.steps .ln{position:absolute;left:12%;top:27px;height:3px;width:76%;background:linear-gradient(90deg,var(--primary),var(--red));border-radius:3px;transform-origin:left;transform:scaleX(1);transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.steps.pre .ln{transform:scaleX(0)}
.step{display:grid;justify-items:center;text-align:center;gap:8px;position:relative;z-index:1}
.step .num{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--primary);display:grid;place-items:center;color:var(--primary);box-shadow:0 8px 18px rgba(18,62,124,.15);transition:transform .3s,background .3s,color .3s}
.step:hover .num{transform:scale(1.1);background:var(--primary);color:var(--on-primary)}
.step b{font-family:var(--f-head);font-weight:500;font-size:15.5px}
.step span{font-size:13px;color:var(--muted);max-width:24ch;line-height:1.5}
.wform .in{transition:border-color .2s,box-shadow .2s}
.ok-box .kic{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.cgrid .ci{display:flex;gap:12px;align-items:flex-start}
.cgrid .ci .kic{width:40px;height:40px;flex:none}
.totop{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);box-shadow:0 12px 28px rgba(18,62,124,.35);cursor:pointer;z-index:30;display:grid;place-items:center;transform:translateY(90px);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.totop.show{transform:none}
.wf nav{display:flex;gap:14px;flex-wrap:wrap}
.wf nav button{background:none;border:0;color:#C9D7EC;cursor:pointer;font-size:12.5px;padding:0}
.wf nav button:hover{color:#fff}
@media (max-width:900px){
 .shw,.sedes-wrap{grid-template-columns:minmax(0,1fr)}
 .orbit-wrap{width:min(300px,86%);margin-top:28px}
 .ob{--r:142px}
 .smap{min-height:0}.smap svg{height:auto;aspect-ratio:400/460}
 .hero .wrap{padding-block:44px 130px}
 .steps{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px}.steps::before,.steps .ln{display:none}
 .stabs button.on{transform:none}
 .smap{min-height:240px}
}
@media (max-width:560px){.ob{width:42px;height:42px;margin:-21px 0 0 -21px}.float-card{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hero,.particles span,.orbit-wrap *,.ob,.lv .bob,.smap .ps,.float-card{animation:none!important}.rv.pre,.steps.pre .ln{transform:none}}

/* escudo sin fondo */
.brand img,.wh .brand img,.ch-top .brand img,.wf .brand img,.ph-h img,.lib-h img,.lcard .crest{object-fit:contain;border-radius:0;box-shadow:none;background:none}
.brand img{width:44px;height:42px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.wh .brand img,.ch-top .brand img{width:46px;height:44px;filter:none}
.lcard .crest{width:120px;height:114px;filter:drop-shadow(0 10px 18px rgba(18,62,124,.25))}
.ph-h img{width:44px;height:42px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.lib-h img{width:62px;height:58px}
.hero-crest{width:min(360px,90%);aspect-ratio:auto;border:0;border-radius:0;box-shadow:none;overflow:visible}
.hero-crest img{height:auto;object-fit:contain;filter:drop-shadow(0 24px 40px rgba(2,14,36,.45))}
@media (max-width:900px){.hero-crest{width:220px}}

/* ---------- Mensajes (chat interno) ---------- */
.nav .nb{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;line-height:1.5}
.chat{display:grid;grid-template-columns:310px minmax(0,1fr);height:calc(100vh - 190px);min-height:440px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.chat-side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.chat-sh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 14px 10px}
.chat-sh h2{font-size:15px}
.chat-list{overflow-y:auto;padding:0 8px 8px;display:grid;gap:2px;align-content:start}
.chat-it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:9px 8px;cursor:pointer;color:inherit;font:inherit}
.chat-it:hover{background:var(--surface-2)}
.chat-it[aria-current="true"]{background:var(--violet-soft)}
.chat-it .tx{display:grid;gap:2px;min-width:0;flex:1}
.chat-it .row{display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}
.chat-it b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-it small{font-size:11.5px;color:var(--muted);flex:none}
.chat-it .tx>small{flex:initial;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-it .pv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-it .badge{background:var(--primary);color:var(--on-primary);border-radius:999px;font-style:normal;font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px;flex:none}
.chat-it.unr b,.chat-it.unr .pv{color:var(--fg);font-weight:700}
.avatar.d{background:var(--ok-soft);color:var(--ok)}
.chat-pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-head>div{flex:1;min-width:0}.chat-head b{display:block;font-size:14px}.chat-head>div span{font-size:12px;color:var(--muted)}
.chat-back{display:none;font-size:18px;line-height:1}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.chat-body.ro{max-height:52vh;border:1px solid var(--line);border-radius:10px}
.chat-day{text-align:center;margin:8px 0 4px}.chat-day span{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.bub{max-width:min(75%,520px);padding:8px 12px 6px;border-radius:14px;font-size:13.5px;line-height:1.45;display:grid;gap:2px;overflow-wrap:anywhere}
.bub small{font-size:10.5px;opacity:.75;justify-self:end}
.bub .bn{font-size:11px;font-weight:700;opacity:.85}
.bub.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.bub.ot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-form{display:flex;gap:8px;padding:10px 12px 6px;border-top:1px solid var(--line)}
.chat-note{font-size:11px;color:var(--muted);padding:0 14px 10px;text-align:center}
.chat-empty{margin:auto;display:grid;justify-items:center;gap:6px;text-align:center;color:var(--muted);padding:24px;max-width:340px}
.chat-empty svg{color:var(--violet)}.chat-empty b{color:var(--fg);font-size:15px}.chat-empty .btn{margin-top:8px}
.msg-pick{display:grid;gap:14px;max-height:55vh;overflow-y:auto}.msg-pick .grp{display:grid;gap:2px}.msg-pick .eyebrow{margin:0 0 2px 8px}
@media (max-width:900px){.chat{grid-template-columns:minmax(0,1fr);height:calc(100vh - 250px);min-height:420px}.chat.open .chat-side{display:none}.chat:not(.open) .chat-pane{display:none}.chat-back{display:inline-flex}}
body:has(.chat.open) .ai-fab,body:has(.chat.open) .ai-panel{display:none!important}
/* ---------- Clases en vivo y pizarra ---------- */
.live{display:inline-flex;align-items:center;gap:6px;background:#C8202F;color:#fff;font-weight:700;font-size:10.5px;letter-spacing:.06em;border-radius:6px;padding:3px 8px;white-space:nowrap}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:liveP 1.2s infinite}
@keyframes liveP{50%{opacity:.25}}
a.btn{text-decoration:none}
.ppt-v{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0E2347;border:1px solid var(--line)}.ppt-v img{width:100%;height:100%;object-fit:contain;display:block}
.ppt-dots{display:flex;gap:6px;justify-content:center}.ppt-dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}.ppt-dots button[aria-current="true"]{background:var(--primary);width:22px;border-radius:5px}
.rec-v{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}.rec-v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.item.vlive{border-color:#C8202F;box-shadow:inset 3px 0 0 #C8202F}
body.room-on{overflow:hidden}
body.room-on .ai-fab,body.room-on .ai-panel,body.room-on .wa-fab{display:none!important}
.room{position:fixed;inset:0;z-index:48;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rm-top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 16px;background:var(--grad);color:#fff;flex-wrap:wrap}
.rm-top .tt{display:flex;align-items:center;gap:12px;min-width:0}
.rm-top .tt b{display:block;font-size:15px;line-height:1.25}.rm-top .tt span:not(.live){font-size:12px;opacity:.85}
.rm-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rbtn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:7px 12px;font-weight:600;font-size:12.5px;line-height:1.2;cursor:pointer;white-space:nowrap}
.rbtn:hover{background:rgba(255,255,255,.22)}
.rbtn[aria-pressed="true"]{background:#fff;color:#123E7C;border-color:#fff}
.rbtn.end{background:#C8202F;border-color:#C8202F}
.rm-time{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;min-width:44px}
.rec{background:#fff;color:#C8202F;font-weight:800;font-size:11px;border-radius:6px;padding:3px 8px;animation:liveP 1.6s infinite}
.rm-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;padding:12px;min-height:0}
.rm-main.free{grid-template-columns:minmax(0,1fr)}
.rm-board{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.tb{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.tb .tl{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:none;color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.tb .tl:hover:not(:disabled){background:var(--surface-2)}
.tb .tl[aria-pressed="true"]{background:var(--violet-soft);border-color:var(--primary);color:var(--primary)}
.tb .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.tb .sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;margin:0 1px}
.tb .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--primary)}
.tb button:disabled{opacity:.35;cursor:not-allowed}
.cv-wrap{flex:1;min-height:0;position:relative;display:grid;place-items:center}
#cv{background:#fff;border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line);touch-action:none;display:block}
#cv.pen{cursor:crosshair}
.ro-tag{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(19,40,74,.8);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap}
.cv-txt{position:absolute;z-index:2;border:1px dashed var(--primary);background:rgba(255,255,255,.95);padding:0 4px;min-width:200px;outline:none;border-radius:4px}
.pgbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rm-side{display:flex;flex-direction:column;gap:10px;min-height:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{position:relative;aspect-ratio:16/10;border-radius:10px;background:#0E2347;color:#fff;display:grid;place-items:center;overflow:hidden;font-size:12px}
.tile.main{grid-column:1/-1}
.tile.more{background:#1B3766;font-weight:700;font-size:14px}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.tile .av{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:700;font-size:13px}
.tile.main .av{width:64px;height:64px;font-size:20px}
.tile.talk .av{animation:talk 1.4s infinite}
@keyframes talk{0%,100%{box-shadow:0 0 0 2px #4ade80}50%{box-shadow:0 0 0 7px rgba(74,222,128,.25)}}
.tile .nm{position:absolute;left:6px;bottom:5px;font-size:10.5px;background:rgba(0,0,0,.5);padding:1px 6px;border-radius:5px;max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.rm-tabs{display:flex;border-bottom:1px solid var(--line)}
.rm-tabs button{flex:1;border:0;background:none;padding:10px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.rm-tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.rm-panel{flex:1;overflow-y:auto;padding:10px 12px;display:grid;gap:10px;align-content:start;min-height:120px}
.rm-msg{display:grid;gap:1px}.rm-msg b{font-size:12px;display:flex;gap:6px;align-items:center}.rm-msg p{font-size:13px;margin:0;line-height:1.4;overflow-wrap:anywhere}.rm-msg small{font-size:10.5px;color:var(--muted)}
.rm-msg.me b{color:var(--primary)}
.rm-chat{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.ppl{display:flex;align-items:center;gap:8px;font-size:13px}.ppl .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.rm-foot{font-size:11px;color:var(--muted);text-align:center;padding:0 12px 8px;margin:0}
@media (max-width:900px){.rm-main{grid-template-columns:minmax(0,1fr);overflow-y:auto;align-content:start}.rm-board{min-height:auto}.cv-wrap{flex:none;aspect-ratio:16/9;width:100%}.rm-side{min-height:440px}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.tile.main{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}.rm-top{padding:8px 12px}.rm-top .tt span:not(.live){display:none}.tb.ro{display:none}.rm-foot{display:none}.ro-tag{top:auto;bottom:8px}}
</style>

/* ---------- utilidades ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const _now=new Date();
const TODAY=(_now.getFullYear()===2026&&_now.getMonth()>=10)?new Date(2026,_now.getMonth(),_now.getDate()):new Date(2026,10,13);
const TISO=iso(TODAY), MT=TODAY.getMonth();
const MES=['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
const MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Setiembre','Octubre','Noviembre','Diciembre'];
const fd=s=>{if(!s)return'—';const[y,m,d]=s.split('-').map(Number);return `${d} ${MES[m-1]} ${y}`};
const fds=s=>{if(!s)return'—';const[,m,d]=s.split('-').map(Number);return `${d} ${MES[m-1]}`};
const addDays=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return iso(d)};
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-new Date(TISO+'T00:00:00'))/864e5);
const hhmm=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const money=n=>'S/ '+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
const pct=(a,b)=>b?Math.round(a/b*100):0;
const initials=n=>n.replace(/^(Prof\.|Mg\.)\s*/,'').split(' ').slice(0,2).map(w=>w[0]).join('');
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=rng(1);const pick=a=>a[Math.floor(R()*a.length)];const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function barChart(items,fmt){const W=600,H=230,pt=26,pb=30,pl=6,pr=6;const max=Math.max(...items.map(i=>i.v),1)*1.1;const bw=(W-pl-pr)/items.length;
 const gl=[1,2,3].map(i=>{const y=pt+(H-pt-pb)*(i-1)/3;return `<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`}).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras"><defs><linearGradient id="gbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bar-a)"/><stop offset="1" style="stop-color:var(--bar-b)"/></linearGradient></defs>${gl}${items.map((it,i)=>{const bh=Math.max(2,(it.v/max)*(H-pt-pb));const w=Math.min(48,bw*.5),x=pl+i*bw+(bw-w)/2,y=H-pb-bh;
  return `<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="5" class="bar"/><text class="v" x="${x+w/2}" y="${y-8}" text-anchor="middle">${fmt(it.v)}</text><text class="l" x="${x+w/2}" y="${H-pb+19}" text-anchor="middle">${it.l}</text>`}).join('')}<line class="base" x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}"/></svg>`}
const kfmt=v=>v>=1000?(v/1000).toFixed(v>=10000?0:1).replace('.',',')+' mil':String(v);
function distBar(counts){const tot=counts.AD+counts.A+counts.B+counts.C||1;return `<div class="dist">${['AD','A','B','C'].map(k=>counts[k]?`<i class="${k}" style="width:${counts[k]/tot*100}%" title="${k}: ${counts[k]}"></i>`:'').join('')}</div>`}

const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function webFx(){
 if(!WEB)return;
 const vh=innerHeight;
 document.querySelectorAll('.web .rv').forEach(el=>{if(el.getBoundingClientRect().top>vh*0.92&&!RM())el.classList.add('pre')});
 const st=document.getElementById('steps');if(st&&(st.getBoundingClientRect().top<vh*0.9||RM()))st.classList.remove('pre');
 if('IntersectionObserver' in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('pre');if(e.target.id==='steps')e.target.classList.remove('pre');io.unobserve(e.target)}}),{threshold:.12});
  document.querySelectorAll('.web .rv.pre,#steps.pre').forEach(el=>io.observe(el));
  const co=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;co.unobserve(e.target);if(RM())return;const el=e.target,n=+el.dataset.n,suf=el.dataset.suf||'',t0=performance.now();const stp=t=>{const k=Math.min(1,(t-t0)/1300),v=Math.round(n*(1-Math.pow(1-k,3)));el.textContent=v+suf;if(k<1)requestAnimationFrame(stp)};requestAnimationFrame(stp)}),{threshold:.6});
  document.querySelectorAll('.web .cnt').forEach(el=>co.observe(el));
  const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const id=e.target.id.replace('w-','');document.querySelectorAll('.wnav button').forEach(b=>b.classList.toggle('on',b.dataset.t===id||(id==='proceso'&&b.dataset.t==='admision')))}}),{rootMargin:'-45% 0px -50% 0px'});
  document.querySelectorAll('.web section[id^="w-"]').forEach(s=>so.observe(s));
 } else document.querySelectorAll('.web .pre').forEach(el=>el.classList.remove('pre'));
 webScroll();
 clearInterval(SHOWT);if(SHOWAUTO&&!RM())SHOWT=setInterval(()=>{if(!WEB||!SHOWAUTO){clearInterval(SHOWT);return}setShow((SHOW+1)%3)},6000);
}
function setShow(i){SHOW=i;document.querySelectorAll('.web .pane').forEach((p,k)=>p.classList.toggle('on',k===i));document.querySelectorAll('.stabs button').forEach((b,k)=>{b.classList.remove('on');void b.offsetWidth;b.classList.toggle('on',k===i)})}

const sedeByName=x=>SEDES.find(sd=>fold(sd.n)===fold(x)||fold(sd.n)===fold('Sede '+x));
function impValidate(rows){const dnis=new Set(S.students.map(s=>s.dni));const fa=Object.fromEntries(AULAS.map(a=>[fold(aulaLabel(a)),a]));
 return rows.filter(nz).map(r=>{const[nom,ape,dni,nac,au,apod,tel]=r.map(cl);const errs=[];const a=fa[fold(au)];
  if(!nom||!ape)errs.push('Faltan nombres');if(!/^\d{8}$/.test(dni))errs.push('DNI inválido');else if(dnis.has(dni))errs.push('DNI ya registrado');if(!a)errs.push('Aula no existe');if(!/^9\d{8}$/.test(tel))errs.push('Celular inválido');
  if(/^\d{8}$/.test(dni))dnis.add(dni);return{nom,ape,dni,nac:/^\d{4}-\d{2}-\d{2}$/.test(nac)?nac:'',a,apod:apod||'—',tel,errs}})}
function valDoc(rows){const dn=new Set(S.docentes.map(d=>d.dni));
 return rows.filter(nz).map(r=>{const[n,dni,esp,se,tel]=r.map(cl);const errs=[];const sd=sedeByName(se);
  if(n.split(/\s+/).length<2)errs.push('Faltan nombres');if(!/^\d{8}$/.test(dni))errs.push('DNI inválido');else if(dn.has(dni))errs.push('DNI ya registrado');if(!esp)errs.push('Falta especialidad');if(!sd)errs.push('Sede no existe');if(!/^9\d{8}$/.test(tel))errs.push('Celular inválido');
  if(/^\d{8}$/.test(dni))dn.add(dni);return{n,dni,esp,sd,tel,errs}})}
function valAula(rows){const seen=new Set(AULAS.map(a=>[a.sede,a.nivel,a.grado,a.sec].join('|')));
 return rows.filter(nz).map(r=>{const[se,niv,gr,sec,tut,cap]=r.map(cl);const errs=[];const sd=sedeByName(se);const nv=['Inicial','Primaria','Secundaria'].find(x=>fold(x)===fold(niv));const g=nv&&GRADOS[nv].find(x=>fold(x)===fold(gr)||fold(x).replace(/\D/g,'')===fold(gr).replace(/\D/g,'')&&fold(gr).replace(/\D/g,''));const sc=sec.toUpperCase();const c=cap===''?30:Number(cap);
  if(!sd)errs.push('Sede no existe');if(!nv)errs.push('Nivel inválido');else if(!g)errs.push('Grado no válido para el nivel');if(!/^[A-Z]$/.test(sc))errs.push('Sección inválida');if(!(c>=1&&c<=45))errs.push('Capacidad fuera de rango');
  const key=[sd&&sd.id,nv,g,sc].join('|');if(!errs.length&&seen.has(key))errs.push('La sección ya existe');if(!errs.length)seen.add(key);return{sd,nv,g,sc,tut,cap:c,errs}})}
function valDeu(rows){const bd=Object.fromEntries(S.students.map(s=>[s.dni,s]));
 return rows.filter(nz).map(r=>{const[dni,n,v,m]=r.map(cl);const errs=[];const st=bd[dni];const mm=Number(String(m).replace(/[^\d.,-]/g,'').replace(',','.'));
  if(!st)errs.push('Alumno no registrado');if(!n)errs.push('Falta concepto');if(!/^\d{4}-\d{2}-\d{2}$/.test(v))errs.push('Fecha inválida');if(!(mm>0))errs.push('Monto inválido');return{st,dni,n,v,m:mm,errs}})}

function isDocP(pid){return /^D/.test(String(pid))}
function pName(pid){if(isDocP(pid)){const d=S.docentes.find(x=>x.id===pid);return d?d.n:'Docente'}const s=stu(pid);return s?fullName(s):'Usuario'}
function pSub(pid){if(isDocP(pid)){if(role()==='est'){const a=stu(msgMe()).aula,cs=CURSOS.filter(c=>S.asig[a+'|'+c]===pid);if(cs.length)return 'Docente · '+cs.join(', ')}const d=S.docentes.find(x=>x.id===pid);return 'Docente'+(d&&d.esp?' · '+d.esp:'')}
 const s=stu(pid);if(!s)return '';const a=aulaById(s.aula);return 'Estudiante · '+a.n+(role()==='dir'?' · '+sedeN(a.sede):'')}
function msgLast(c){const x=c.m[c.m.length-1];return x?x.f+' '+x.h:'9999'}
function myConvs(){const me=msgMe();return S.msg.convs.filter(c=>c.p.includes(me)).sort((a,b)=>msgLast(b).localeCompare(msgLast(a)))}
function convUnread(c){return Math.max(0,c.m.length-(c.seen[msgMe()]||0))}
function msgUnread(){return S.msg&&msgMe()?myConvs().reduce((n,c)=>n+convUnread(c),0):0}
function msgRepPend(){return S.msg?S.msg.convs.filter(c=>c.rep&&c.rep.estado==='Pendiente').length:0}
function msgBadge(){const r=role();return ['doc','est'].includes(r)?msgUnread():r==='dir'?msgRepPend():0}
function dLab(f){return f===TISO?'Hoy':f===addDays(-1)?'Ayer':fd(f)}
function tLab(x){return !x?'':x.f===TISO?x.h:x.f===addDays(-1)?'Ayer':fds(x.f)}
function msgContacts(){const r=role(),me=msgMe();
 if(r==='est'){const a=stu(me).aula,ds=[...new Set(CURSOS.map(c=>S.asig[a+'|'+c]).filter(Boolean))];return [['Mis docentes',ds],['Compañeros de '+aulaById(a).n,aulaStudents(a).filter(s=>s.id!==me).map(s=>s.id)]]}
 if(r==='doc'){const as=[...new Set(Object.entries(S.asig).filter(([,d])=>d===me).map(([k])=>k.split('|')[0]))];return as.map(a=>['Alumnos de '+aulaById(a).n,aulaStudents(a).map(s=>s.id)])}

const avP=pid=>`<span class="avatar${isDocP(pid)?' d':''}">${initials(pName(pid))}</span>`;
function bubbles(c,me){let ld='';return c.m.map(x=>{const d=x.f!==ld?`<div class="chat-day"><span>${dLab(x.f)}</span></div>`:'';ld=x.f;
 const mine=me?x.fr===me:x.fr===c.p[1];return d+`<div class="bub ${mine?'me':'ot'}">${me?'':`<span class="bn">${esc(pName(x.fr))}</span>`}<span>${esc(x.tx)}</span><small>${x.h}</small></div>`}).join('')}
function vMsg(){if(role()==='dir')return msgSup();
 const me=msgMe(),cs=myConvs(),cur=cs.find(c=>c.id===S.ui.conv)||null;
 if(cur&&convUnread(cur)){cur.seen[me]=cur.m.length;save()}
 const vis=cs.filter(c=>c.m.length||(cur&&c.id===cur.id));
 const list=vis.length?vis.map(c=>{const o=c.p.find(x=>x!==me),l=c.m[c.m.length-1],u=convUnread(c);
  return `<button class="chat-it${u?' unr':''}" data-a="msgOpen" data-id="${c.id}" ${cur&&cur.id===c.id?'aria-current="true"':''}>${avP(o)}<span class="tx"><span class="row"><b>${esc(pName(o))}</b><small>${tLab(l)}</small></span><span class="row"><span class="pv">${l?(l.fr===me?'Tú: ':'')+esc(l.tx):'Nueva conversación'}</span>${u?`<i class="badge">${u}</i>`:''}</span></span></button>`}).join(''):'<div class="empty" style="margin:0 6px">Aún no tienes conversaciones.</div>';
 const pane=cur?chatPane(cur,me):`<div class="chat-empty">${icon('msg',36)}<b>Tus mensajes</b><span>Elige una conversación o escribe ${role()==='est'?'a uno de tus docentes o a un compañero de tu aula':'a uno de tus alumnos'}.</span><button class="btn" data-a="msgNew">Nuevo mensaje</button></div>`;

 return `<div class="chat${cur?' open':''}"><aside class="chat-side"><div class="chat-sh"><h2>Conversaciones</h2><button class="btn sm" data-a="msgNew">+ Nuevo</button></div><div class="chat-list">${list}</div></aside><section class="chat-pane" aria-label="Conversación">${pane}</section></div>`}
function chatPane(c,me){const o=c.p.find(x=>x!==me);
 return `<header class="chat-head"><button class="btn ghost sm chat-back" data-a="msgBack" aria-label="Volver a las conversaciones">‹</button>${avP(o)}<div><b>${esc(pName(o))}</b><span>${esc(pSub(o))}</span></div>${c.rep&&c.rep.by===me?'<span class="chip warn">Reportada</span>':c.m.length?`<button class="btn ghost sm" data-a="msgRep" data-id="${c.id}">Reportar</button>`:''}</header>

function msgRepHTML(id){return `${mhead('Reportar conversación','La dirección revisará la conversación completa. La otra persona no sabrá que la reportaste.')}<form data-f="msgRep" data-id="${id}" class="fg"><div class="field full"><label for="rp1">Motivo</label><select class="in" id="rp1" name="mot">${['Lenguaje ofensivo o insultos','Me molesta o acosa','Me presiona para copiar la tarea','Contenido inapropiado','Otro motivo'].map(x=>opt(x,x,'')).join('')}</select></div><div class="field full"><label for="rp2">Detalle (opcional)</label><textarea class="in" id="rp2" name="det" maxlength="500"></textarea></div><div class="mf full"><button type="button" class="btn ghost" data-a="close">Cancelar</button><button class="btn">Enviar reporte</button></div></form>`}
function msgEstado(c){return !c.rep?'<span class="muted">Sin reportes</span>':c.rep.estado==='Pendiente'?'<span class="chip bad">Reportada · pendiente</span>':'<span class="chip ok">Revisada</span>'}

 const rep=cs.filter(c=>c.rep).sort((a,b)=>(b.rep.estado==='Pendiente')-(a.rep.estado==='Pendiente')),rows=S.ui.msgTab==='rep'?rep:cs;

function msgViewHTML(c){const r=c.rep;return `${mhead(c.p.map(pName).map(esc).join(' y '),'Conversación de solo lectura')}
 ${r?`<div class="alert${r.estado==='Pendiente'?'':' info'}" style="margin-bottom:12px"><span>⚑</span><span><b>Reportada por ${esc(pName(r.by))}</b> ${r.f===TISO?'hoy':r.f===addDays(-1)?'ayer':'el '+fd(r.f)} a las ${r.h} · ${esc(r.mot)}${r.estado!=='Pendiente'&&r.por?` · revisada por ${esc(r.por)}`:''}</span></div>`:''}

const curBim=()=>{const b=+S.ui.bim;return isNaN(b)?3:b};
function kidAvg(s,c){const b=curBim();let v=promBim(s.id,c,b);if(v==null&&b>0)v=promBim(s.id,c,b-1);return v}
function nTxt(n,s){if(n==null)return '—';const lv=aulaById(s.aula).nivel;return lv==='Secundaria'?pad(n):`${lit(n)} (${pad(n)})`}
function pickKid(q){const ks=famKids();return ks.find(k=>q.includes(fold(k.nom)))||(role()==='pad'?curKid():ks[0])}
function pendTasks(s){const out=[];CURSOS.forEach(c=>{const l=S.lms[s.aula+'|'+c];if(!l)return;l.tar.forEach(t=>{if(!t.ent[s.id]&&t.lim>=TISO)out.push({c,t:t.t,lim:t.lim})})});return out}
const li=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
const src=t=>`<span class="src">Fuente: ${t}</span>`;

function ansFam(q){
 const k=pickKid(q),nm=k.nom,me=role()==='est';
 if(has(q,'asistencia','falta','tardanza','asistio')){
  const a=S.asis[k.id];return `${me?'Tu':'La'} asistencia ${me?'':'de '+nm+' '}del año es de <b>${asisPct(k.id)}%</b>: ${a.A} días presente, ${a.T} tardanza(s) y ${a.F} falta(s).${src('Asistencia de alumnos')}`}
 if(has(q,'nota','promedio','curso','como va','como le fue','rendimiento','libreta','boleta')){
  const rows=CURSOS.map(c=>({c,v:kidAvg(k,c)})).filter(r=>r.v!=null);const best=rows.slice().sort((a,b)=>b.v-a.v)[0],low=rows.slice().sort((a,b)=>a.v-b.v)[0];
  return `${me?'Tus':'Las'} notas ${me?'':'de '+nm+' '}en el ${BIM[curBim()]} bimestre:${li(rows.map(r=>`${r.c}: <b>${nTxt(r.v,k)}</b>`))}Su mejor curso es <b>${best.c}</b>${low.v<14?` y conviene reforzar <b>${low.c}</b>`:''}.${src('Notas y libretas')}`}
 if(has(q,'tarea','pendiente','entregar','deber')){
  const t=pendTasks(k);if(!t.length)return `${me?'No tienes':nm+' no tiene'} tareas pendientes. ¡Todo al día! 🎉${src('Aula virtual')}`;
  return `${me?'Tienes':nm+' tiene'} ${t.length} tarea(s) pendiente(s):${li(t.map(x=>`<b>${x.c}</b>: ${esc(x.t)} · vence el ${fds(x.lim)}`))}${src('Aula virtual')}`}
 if(has(q,'pago','pension','deuda','debo','cuota','mensualidad','vencid')){
  if(me)return 'La información de pagos la ve tu padre, madre o apoderado desde su cuenta. 😊';
  const ks=famKids();const out=ks.map(s=>{const c=cuenta(s);const next=c.rows.find(r=>r.est==='Pendiente');return `<b>${s.nom}</b>: ${c.venc?`${money(c.venc)} vencido (${c.nV} cuota/s)`:'sin deuda vencida'}${next?` · próxima: ${next.n} (${money(next.m)}), vence el ${fds(next.v)}`:''}`});
  return `Este es el estado de cuenta de sus hijos:${li(out)}Puede pagar en línea con tarjeta o Yape, o enviar su voucher, desde <b>Pensiones</b>.${src('Pagos, pensiones y estados de cuenta')}`}
 if(has(q,'comunicado','aviso','reunion','noticia')){
  const cs=kidComs(k).slice(0,3);return `Últimos comunicados:${li(cs.map(c=>`<b>${esc(c.tit)}</b> (${fds(c.f)}): ${esc(c.body)}`))}${src('Comunicados y avisos')}`}
 return null}

function ansDoc(q){
 const aulas=AULAS.filter(a=>DOC_AULAS.includes(a.id)),c='Matemática',b=curBim();
 if(has(q,'resumen','aula','como van','avance')){
  return `Resumen de Matemática, ${BIM[b]} bimestre:${li(aulas.map(a=>{const sts=aulaStudents(a.id);const vs=sts.map(s=>promBim(s.id,c,b)).filter(v=>v!=null);const avg=vs.length?Math.round(vs.reduce((x,y)=>x+y,0)/vs.length):null;const t=S.lms[a.id+'|'+c].tar[0];const sin=sts.filter(s=>!t.ent[s.id]).length;return `<b>${a.n}</b>: promedio ${avg??'—'} · ${sin} alumno(s) sin entregar «${esc(t.t)}»`}))}${src('Registro de notas y aula virtual')}`}
 if(has(q,'apoyo','riesgo','bajo','desaprob','refuerzo')){
  const r=[];aulas.forEach(a=>aulaStudents(a.id).forEach(s=>{const v=promBim(s.id,c,b)??promBim(s.id,c,b-1);if(v!=null&&v<13)r.push(`${fullName(s)} (${a.n}): ${pad(v)}`)}));
  return r.length?`Estos estudiantes necesitan apoyo en Matemática:${li(r.slice(0,6))}Sugerencia: reforzar fracciones con la ficha N.° 7 y una práctica guiada.${src('Registro de notas')}`:'Ningún estudiante está por debajo de 13 en este bimestre. 👏'}
 if(has(q,'comunicado','redacta','mensaje','padres')){
  return `Aquí tienes un borrador:<br><br><i>«Estimadas familias: les recordamos que esta semana trabajaremos fracciones y decimales en Matemática. Les pedimos revisar con sus hijos la ficha N.° 7 publicada en el aula virtual y verificar la entrega de la tarea antes de la fecha límite. Gracias por su apoyo. Prof. Rosa Quispe Huamán.»</i><br><br>Puedes copiarlo en <b>Avisos</b> y elegir el aula de destino.`}
 if(has(q,'pregunta','examen','evaluacion','propon')){
  return `Propuesta de preguntas para el banco:${li(['<b>Opción múltiple:</b> ¿Cuál es el resultado de 2/3 + 1/6? a) 5/6 ✓ b) 3/9 c) 1/2 d) 3/6','<b>Verdadero/Falso:</b> 3/5 es mayor que 1/2. (Verdadero)','<b>Respuesta corta:</b> Escribe 3/4 como número decimal. (0,75)'])}Puedes agregarlas en <b>Evaluaciones › Banco de preguntas</b>.`}
 return null}

function ansAdm(q){
 const sts=visStudents(),r=role();
 const sedes=fixedSede()?SEDES.filter(s=>s.id===fixedSede()):SEDES;
 if(has(q,'morosidad','moroso','deuda','vencid')&&!has(q,'familia')){
  const rows=sedes.map(se=>{const ss=S.students.filter(s=>s.sede===se.id);let v=0,n=0;ss.forEach(s=>{const c=cuenta(s);if(c.venc){v+=c.venc;n++}});return{n:se.n,v,f:n,t:ss.length}}).sort((a,b)=>b.v-a.v);
  return `Morosidad al ${fd(TISO)}:${li(rows.map(x=>`<b>${x.n}</b>: ${money(x.v)} vencido · ${x.f} de ${x.t} alumnos (${pct(x.f,x.t)}%)`))}${rows.length>1?`La sede con más deuda es <b>${rows[0].n}</b>. Puedo ayudarte a preparar un recordatorio para esas familias.`:''}${src('Pagos y estados de cuenta')}`}
 if(has(q,'familia','mas deuda')){
  const rows=sts.map(s=>({s,c:cuenta(s)})).filter(x=>x.c.venc).sort((a,b)=>b.c.venc-a.c.venc).slice(0,5);
  return `Familias con más deuda vencida:${li(rows.map(x=>`${esc(x.s.apod)} (${fullName(x.s)}, ${sedeN(x.s.sede)}): <b>${money(x.c.venc)}</b>`))}${src('Estados de cuenta')}`}
 if(has(q,'recaud','ingreso','cobr')){
  const m=recaudacion(sts),cur=m[MT],prev=m[MT-1];
  return `En ${MESL[MT].toLowerCase()} se ha recaudado <b>${money(cur)}</b> hasta hoy${fixedSede()?' en '+sedeN(fixedSede()):' en las 4 sedes'}. El mes anterior cerró con ${money(prev)}.${src('Control de ingresos')}`}
 if(has(q,'voucher','constancia')){
  const v=visVou().filter(x=>x.estado==='Por revisar');
  return v.length?`Hay <b>${v.length}</b> voucher(s) por revisar:${li(v.map(x=>{const s=stu(x.sid);return `${fullName(s)} · ${money(x.monto)} · ${x.m} N.° ${x.op}`}))}Puedes aprobarlos en <b>Pensiones</b>.`:'No hay vouchers pendientes de revisión. ✅'}
 if(has(q,'asistencia')&&has(q,'hoy','dia')){
  const h=asisHoyStats(visAulas());return `Hoy la asistencia va en <b>${h.pctv}%</b> (${h.pres} de ${h.tot} alumnos registrados).${h.pend.length?` Aún falta registrar: ${h.pend.map(a=>a.n+' ('+sedeN(a.sede)+')').join(', ')}.`:' Todas las aulas registraron.'}${src('Asistencia de alumnos')}`}
 if(has(q,'falta','asistencia','inasist')){
  const rows=sts.slice().sort((a,b)=>S.asis[b.id].F-S.asis[a.id].F).slice(0,5);
  return `Alumnos con más faltas en el año:${li(rows.map(s=>`${fullName(s)} · ${aulaById(s.aula).n}, ${sedeN(s.sede)}: <b>${S.asis[s.id].F} faltas</b>`))}Sugiero que los tutores se comuniquen con estas familias.${src('Asistencia de alumnos')}`}
 if(has(q,'apoyo','riesgo','rendimiento','bajo','desaprob')){
  const b=curBim(),rows=[];sts.forEach(s=>{const low=CURSOS.filter(c=>{const v=promBim(s.id,c,b)??promBim(s.id,c,b-1);return v!=null&&v<11});if(low.length)rows.push({s,low})});
  rows.sort((a,b)=>b.low.length-a.low.length);
  return rows.length?`<b>${rows.length}</b> alumno(s) tienen al menos un curso en C (menos de 11). Los casos principales:${li(rows.slice(0,5).map(x=>`${fullName(x.s)} (${aulaById(x.s.aula).n}): ${x.low.join(', ')}`))}${src('Notas y libretas')}`:'No hay alumnos con cursos en C en este bimestre. 👏'}
 if(has(q,'ratific')){
  const p=sts.filter(s=>s.rat==='Pendiente');return `Hay <b>${p.length}</b> ratificaciones pendientes de ${sts.length} alumnos (${pct(p.length,sts.length)}%).${src('Alumnos y padres')}`}
 if(has(q,'admision','solicitud')){
  const n=S.sol.filter(x=>x.estado==='Nueva');return `Hay <b>${n.length}</b> solicitudes de admisión nuevas:${li(n.map(x=>`${esc(x.apod)} · ${x.grado} ${x.nivel} · ${sedeN(x.sede)}`))}${src('Admisión y página web')}`}
 if(has(q,'alumno','matricul','cuantos')){
  return `Hay <b>${sts.length}</b> alumnos matriculados${fixedSede()?' en '+sedeN(fixedSede()):' en las 4 sedes'}.${src('Alumnos y padres')}`}
 return null}

function answer(text){
 const q=fold(text),r=role();
 if(has(q,'hola','buenos','buenas'))return `¡Hola, ${user().user.split(' ').filter(w=>!/\./.test(w))[0]}! Soy Thomson IA. Puedo responder preguntas con la información del sistema. Prueba con una de las sugerencias.`;
 if(has(q,'gracias'))return '¡Con gusto! Si necesitas algo más, aquí estoy. 😊';
 let a=null;
 if(r==='pad'||r==='est')a=ansFam(q);else if(r==='doc')a=ansDoc(q);else a=ansAdm(q);
 if(a)return a;
 if(['pad','est','doc'].includes(r)){derive(text);return 'No encontré esa información en el sistema o no está dentro de tus permisos. Derivé tu consulta a <b>secretaría</b> de tu sede; te responderán a la brevedad.'}
 return 'No encontré esa información en el sistema o no está dentro de tus permisos. Prueba con una de las sugerencias.'}

function addMsg(html,who){const d=document.createElement('div');d.className='ai-m '+who;d.innerHTML=html;$('aiBody').appendChild(d);$('aiBody').scrollTop=1e6;return d}
function ask(text){
 text=String(text||'').trim();if(!text||AI.busy)return;AI.busy=true;
 addMsg(esc(text),'u');$('aiIn').value='';
 const t=addMsg('<span class="ai-typing"><i></i><i></i><i></i></span>','b');
 setTimeout(()=>{try{if(aiUsed()>=S.config.ai.lim){if(['pad','est','doc'].includes(role()))derive(text);t.innerHTML='El asistente llegó al límite de consultas de este mes y está en pausa.'+(['pad','est','doc'].includes(role())?' Derivé tu pregunta a <b>secretaría</b> para que te respondan.':' Puedes ampliar el límite en <b>Usuarios y seguridad › Asistente IA</b>.')}else t.innerHTML=answer(text)}catch(e){t.innerHTML='Tuve un problema al consultar los datos. Inténtalo de nuevo.'}
  $('aiBody').scrollTop=1e6;AI.busy=false;
  try{S.log.unshift({t:`${TISO} ${hhmm()}`,u:user().user,r:user().n,a:'Consulta al asistente IA',d:text.slice(0,80)});save()}catch(e){}},700+Math.random()*700)}
function aiReset(){
 const r=role();AI.role=r;$('aiBody').innerHTML='';
 const who=r==='pad'?'sobre las notas, tareas, asistencia y pagos de sus hijos':r==='est'?'sobre tus notas, tareas y asistencia':r==='doc'?'sobre tus aulas, o pedirme ayuda para redactar avisos y preguntas':'sobre asistencia, rendimiento, morosidad y recaudación';
 addMsg(`¡Hola, <b>${esc(user().user)}</b>! 👋 Soy <b>Thomson IA</b>, el asistente del colegio. Pregúntame ${who}. Solo uso la información que tu perfil puede ver.`,'b');
 $('aiSug').innerHTML=(SUG[r]||[]).map(s=>`<button type="button">${s}</button>`).join('')}
function aiSync(){
 const inApp=!WEB&&!!S.session;
 waFab.hidden=!WEB;
 if(inApp&&!aiOn())AI.open=false;
 $('aiFab').hidden=!inApp||AI.open||!aiOn();
 if(!inApp||!aiOn()){AI.open=false;$('aiPanel').hidden=true;return}
 if(AI.role!==role())aiReset();
 $('aiPanel').hidden=!AI.open;
}
function aiWeb(){if(!WEB)return;const hb=document.querySelector('#w-inicio .cta');if(hb&&!hb.querySelector('.wa'))hb.insertAdjacentHTML('beforeend',`<a class="btn wa" href="${WA_URL}" target="_blank" rel="noopener">${WA_ICON}Escríbenos por WhatsApp</a>`);waFab.hidden=false;$('aiFab').hidden=true;$('aiPanel').hidden=true}
$('aiFab').onclick=()=>{AI.open=true;aiSync();setTimeout(()=>$('aiIn').focus(),50)};
$('aiClose').onclick=()=>{AI.open=false;aiSync()};
$('aiForm').onsubmit=e=>{e.preventDefault();ask($('aiIn').value)};
$('aiSug').onclick=e=>{const b=e.target.closest('button');if(b)ask(b.textContent)};
const _render0=render;
render=function(){_render0();aiSync();aiWeb()};
aiSync();aiWeb();
</script>
</body></html>
