<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plantilla post CE 1080×1080</title>
<link rel="stylesheet" href="marca.css">
<style>
  /* Lienzo fijo: post 1080×1080 (manual 5.1, "Diagramación para Ads"). Para 1080×1350 o 1080×1920 cambia --alto. */
  :root { --ancho: 1080px; --alto: 1080px; --margen: 88px; }
  html, body { margin: 0; width: var(--ancho); height: var(--alto); overflow: hidden; background: var(--ce-blanco); color: var(--ce-negro); }
  .lienzo { position: relative; width: var(--ancho); height: var(--alto); overflow: hidden; font-family: var(--ce-font-pieza); }
  .contenido { position: absolute; inset: 0 var(--margen); display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 70px; }
  .ce-encabezado { font-size: 24px; }
  .ce-titulo { font-size: 104px; margin: 40px 0 26px; }
  .ce-apoyo { font-size: 32px; }
  .pastilla-pos { position: absolute; left: 0; right: 0; bottom: 230px; display: flex; justify-content: center; }
  .ce-pastilla { font-size: 30px; }
  .logos { position: absolute; left: var(--margen); right: var(--margen); bottom: 92px; display: flex; justify-content: space-between; align-items: center; }
  .logos .bloque { display: flex; align-items: center; gap: 18px; font-style: italic; font-size: 24px; line-height: 1.1; text-align: left; }
  .logos .bloque.der { text-align: right; }
  .logos .sep { width: 2px; height: 56px; background: var(--ce-negro); }
  .logos img { height: 64px; display: block; }
  .ce-pie { position: absolute; left: 0; right: 0; bottom: 0; font-size: 22px; padding: 14px; }
  .ce-arco { left: 50%; bottom: -1000px; width: 1500px; height: 1500px; transform: translateX(-50%); z-index: 0; }
  .contenido, .logos, .pastilla-pos { z-index: 1; }
</style>
</head>
<body>
<div class="lienzo">
  <!-- Arco amarillo opcional (piezas institucionales). Bórralo si la pieza va con foto o fondo de curso. -->
  <svg class="ce-arco" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="#ffc300" stroke-width="9"/></svg>

  <div class="contenido">
    <div class="ce-encabezado">Curso <b>100% virtual</b></div>
    <h1 class="ce-titulo">Título en<br>dos líneas</h1>
    <p class="ce-apoyo">Texto de apoyo en una línea<br>y una segunda línea opcional</p>
  </div>

  <div class="pastilla-pos"><span class="ce-pastilla ce-pastilla--negra">Inscríbete hoy</span></div>

  <div class="logos">
    <div class="bloque"><img src="logos/imagotipo-mono-negro.svg" alt="Cámara de Comercio Exterior"><span class="sep"></span><span>Inicio<br>12 de enero</span></div>
    <div class="bloque der"><span>Clases<br>en vivo</span><span class="sep"></span><img src="logos/isologo-color.svg" alt=""></div>
  </div>

  <div class="ce-pie">camaracomercioexterior.edu.pe</div>
</div>
</body>
</html>
